name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -c 'import pathlib; [compile(p.read_bytes(), str(p), "exec") for p in pathlib.Path(".").rglob("*.py")]'
      - run: bash -n install.sh
      - run: python -m json.tool easy-auto-research/templates/research_spec.template.json >/dev/null
      - run: python -m json.tool easy-auto-research/reference/research_spec.filled_example.json >/dev/null
      - run: python easy-auto-research/scripts/init.py --help >/dev/null
      - run: python easy-auto-research/scripts/harness.py --help >/dev/null
      - run: python easy-auto-research/scripts/watch_session.py --help >/dev/null
      - run: python -c 'import pathlib; assert not any(p.name in {"__pycache__", ".pytest_cache", ".ruff_cache"} or p.suffix == ".pyc" for p in pathlib.Path(".").rglob("*"))'
